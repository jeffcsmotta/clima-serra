<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" fill="none">
  <defs>
    <linearGradient id="coldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="warmGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <linearGradient id="badgeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
  </defs>

  <!-- Icon Container with Mountain & Dual Thermal Flow -->
  <g transform="translate(10, 10)">
    <!-- Outer Shield / Rounded Container -->
    <rect x="0" y="0" width="100" height="100" rx="24" fill="url(#badgeBg)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="2"/>
    
    <!-- Mountain Peak Silhouette (Serra Gaúcha) -->
    <path d="M 22 74 L 46 38 L 58 54 L 68 40 L 82 74 Z" fill="#1E293B" stroke="#334155" stroke-width="2" stroke-linejoin="round"/>
    
    <!-- Snowcap / Thermal Airflow Waves -->
    <!-- Cool Air Wave (Top/Left) -->
    <path d="M 24 46 C 34 38, 44 50, 54 42 C 64 34, 72 44, 80 38" stroke="url(#coldGradient)" stroke-width="4" stroke-linecap="round" fill="none"/>
    <!-- Second Cool Wave -->
    <path d="M 20 58 C 30 50, 42 62, 54 54 C 66 46, 76 56, 84 50" stroke="url(#coldGradient)" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 1" fill="none" opacity="0.8"/>
    
    <!-- Warm Air Accent (Cycle Heating) -->
    <path d="M 30 70 C 40 64, 52 74, 64 68 C 72 64, 78 70, 82 66" stroke="url(#warmGradient)" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    
    <!-- Central Snowflake Star Accent -->
    <circle cx="50" cy="24" r="3.5" fill="#38BDF8" />
  </g>

  <!-- Typography -->
  <!-- CLIMA -->
  <text x="126" y="62" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-size="44" font-weight="900" fill="#0F172A" letter-spacing="-1">
    CLIMA
  </text>
  <!-- SERRA -->
  <text x="272" y="62" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-size="44" font-weight="900" fill="#0284C7" letter-spacing="-1">
    SERRA
  </text>

  <!-- Subtitle / Positioning -->
  <text x="128" y="90" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="700" fill="#475569" letter-spacing="2.8">
    CLIMATIZAÇÃO &amp; AR CONDICIONADO
  </text>
  
  <!-- Location Tag -->
  <rect x="424" y="44" width="86" height="24" rx="12" fill="#E0F2FE" />
  <text x="432" y="60" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="800" fill="#0369A1">
    CAXIAS DO SUL
  </text>
</svg>
