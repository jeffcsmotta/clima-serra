<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 120" fill="none">
  <defs>
    <!-- Gradiente oficial do ícone: Ciano Glacial para Azul Marinho Profundo -->
    <linearGradient id="climaGrad" x1="0%" y1="20%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="65%" stop-color="#0E5A8A" />
      <stop offset="100%" stop-color="#082C4D" />
    </linearGradient>
  </defs>

  <!-- SÍMBOLO: Evaporadora Split + Engrenagem de Manutenção -->
  <g id="clima-icon">
    <!-- Gabinete do Ar Condicionado -->
    <rect x="18" y="20" width="168" height="78" rx="18" fill="none" stroke="url(#climaGrad)" stroke-width="5" stroke-linejoin="round" />
    
    <!-- Aleta inferior de fluxo de ar -->
    <rect x="32" y="75" width="140" height="11" rx="3.5" fill="none" stroke="url(#climaGrad)" stroke-width="4.5" stroke-linejoin="round" />

    <!-- Engrenagem Técnica (Manutenção / Conserto) -->
    <g transform="translate(110, 29) scale(1.65)" stroke="url(#climaGrad)" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" />
      <circle cx="12" cy="12" r="3.2" />
    </g>
  </g>

  <!-- TIPOGRAFIA: Clima Serra & Especialidade -->
  <g id="clima-text">
    <!-- Nome Principal -->
    <text x="214" y="66" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="46" font-weight="900" fill="#082C4D" letter-spacing="1">
      CLIMA SERRA
    </text>

    <!-- Subtítulo Técnico Institucional -->
    <text x="216" y="93" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#475569" letter-spacing="2.4">
      CONSERTO E MANUTENÇÃO DE AR CONDICIONADO
    </text>
  </g>
</svg>
